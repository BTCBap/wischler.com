    <style>
      :root {
        --paper: #f4f1ea;
        --ink: #161412;
        --brass: #8d7349;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
      }

      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mark {
        display: block;
        width: 44px;
        height: 44px;
        margin: 0 auto;
        animation: rise 680ms cubic-bezier(0.2, 0, 0, 1) both;
      }

      h1 {
        margin: 32px 0 0;
        font-family: "Cormorant Garamond", Palatino, serif;
        font-weight: 500;
        font-size: clamp(3.75rem, 12vw, 8rem);
        line-height: 1;
        letter-spacing: -0.02em;
        text-align: center;
        animation: rise 680ms cubic-bezier(0.2, 0, 0, 1) 80ms both;
      }

      .rule {
        width: 64px;
        height: 1px;
        margin: 40px auto 0;
        background: var(--brass);
        transform: scaleX(0);
        transform-origin: center;
        animation: draw 900ms cubic-bezier(0.2, 0, 0, 1) 420ms forwards;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes draw {
        to {
          transform: scaleX(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark,
        h1,
        .rule {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
